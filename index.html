<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A2E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Focus Timer</title>
<style>
:root{--bg:#0F2A2E;--ink:#EDE6D6;--dim:#8FA5A3;--accent:#FF6B6B;--track:#1D4047}
body.break{--accent:#7FD6B2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{height:100%}body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px)}
button{font:inherit;cursor:pointer;transition:transform .12s,background .2s,border-color .2s}
button:active{transform:scale(.93)}
.modes{display:flex;gap:8px}
.modes button{background:none;border:1px solid var(--track);color:var(--dim);padding:8px 20px;border-radius:20px;font-size:15px}
.modes button.on{border-color:var(--accent);color:var(--ink);background:var(--track)}
.ring{position:relative;width:min(76vw,310px);aspect-ratio:1;cursor:pointer}
.ring.run{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
@media(prefers-reduced-motion:reduce){.ring.run{animation:none}}
svg{width:100%;height:100%;transform:rotate(-90deg)}
circle{fill:none;stroke-width:10}
.t{stroke:var(--track)}
.p{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s linear,stroke .3s}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.time{font-size:clamp(50px,15vw,72px);font-weight:300;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--dim)}
.set{display:flex;align-items:center;gap:16px}
.set button{width:44px;height:44px;border-radius:50%;border:1px solid var(--track);background:var(--track);color:var(--ink);font-size:24px;line-height:1}
.set .val{min-width:110px;text-align:center;font-size:18px}
.set .val small{display:block;font-size:12px;color:var(--dim)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips button{background:none;border:1px solid var(--track);color:var(--dim);padding:6px 14px;border-radius:16px;font-size:14px}
.chips button.on{border-color:var(--accent);color:var(--ink)}
.ctrl{display:flex;gap:12px}
.ctrl button{padding:14px 36px;border-radius:30px;border:0;font-size:17px;font-weight:600}
#go{background:var(--accent);color:#0F2A2E;min-width:130px}
#reset{background:var(--track);color:var(--ink)}
.dots{display:flex;gap:8px;min-height:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pop .3s}
@keyframes pop{from{transform:scale(0)}}
.count{color:var(--dim);font-size:14px;text-align:center}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.gear{background:none;border:1px solid var(--track);color:var(--dim);padding:8px 18px;border-radius:20px;font-size:14px}
.panel{width:min(92vw,360px);background:var(--track);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;font-size:15px;user-select:auto}
.panel[hidden]{display:none}
.panel label{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel select,.panel #test{background:var(--bg);color:var(--ink);border:1px solid var(--dim);border-radius:10px;padding:8px 10px;font-size:14px}
.panel input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.panel input[type=file]{max-width:170px;font-size:12px;color:var(--dim)}
.panel small{color:var(--dim);font-size:12px;line-height:1.4}
</style>
</head>
<body>
<div class="modes">
  <button id="m-focus" class="on">Focus</button>
  <button id="m-break">Break</button>
</div>

<div class="ring" id="ring-wrap">
  <svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="54"/><circle class="p" id="ring" cx="60" cy="60" r="54"/></svg>
  <div class="mid"><div class="time" id="time">25:00</div><div class="hint" id="hint">Tap to start</div></div>
</div>

<div class="set">
  <button id="minus" aria-label="Decrease minutes">&minus;</button>
  <div class="val"><span id="mins">25</span> min<small id="setlabel">Focus length</small></div>
  <button id="plus" aria-label="Increase minutes">+</button>
</div>
<div class="chips" id="chips"></div>

<div class="ctrl">
  <button id="go">Start</button>
  <button id="reset">Reset</button>
</div>
<div class="dots" id="dots"></div>
<div class="count" id="count"></div>
<button class="gear" id="gear">&#9881; Alerts</button>
<div class="panel" id="panel" hidden>
  <label>Sound
    <span><select id="snd">
      <option value="chime">Chime</option><option value="bell">Bell</option>
      <option value="soft">Soft melody</option><option value="beep">Beep</option>
      <option value="digital">Digital</option><option value="custom">My own file</option>
      <option value="silent">Silent</option></select>
    <button id="test">Play</button></span></label>
  <label>My own sound <input type="file" id="file" accept="audio/*"></label>
  <label>Vibrate <input type="checkbox" id="vib"></label>
  <label>Show notification <input type="checkbox" id="notif"></label>
  <label>Keep screen on while running <input type="checkbox" id="wake"></label>
  <small id="note">Notifications and sounds work best when the app stays open. Turn on "Keep screen on" for the most reliable alert.</small>
</div>

<script>
const $ = id => document.getElementById(id);
const C = 2*Math.PI*54;
const PRESETS = { focus:[15,25,45,60], break:[5,10,15] };
const LIMITS  = { focus:[1,180], break:[1,60] };
let mins = { focus:25, break:5 };
let mode='focus', left=0, endAt=null, tick=null, sessions=0;
const today = new Date().toDateString();

// Load saved settings and today's sessions
try {
  const s = JSON.parse(localStorage.getItem('timer')||'{}');
  if (s.mins) mins = s.mins;
  if (s.day===today) sessions = s.n||0;
} catch(e){}
function save(){ try{ localStorage.setItem('timer', JSON.stringify({mins, day:today, n:sessions})); }catch(e){} }
const buzz = ms => { if (navigator.vibrate) navigator.vibrate(ms); };
const total = () => mins[mode]*60;

$('ring').style.strokeDasharray = C;

function chips(){
  $('chips').innerHTML = '';
  PRESETS[mode].forEach(m=>{
    const b = document.createElement('button');
    b.textContent = m+' min';
    b.className = m===mins[mode] ? 'on' : '';
    b.onclick = ()=>setMinutes(m);
    $('chips').appendChild(b);
  });
}

function draw(){
  const mm = String(Math.floor(left/60)).padStart(2,'0');
  const ss = String(left%60).padStart(2,'0');
  $('time').textContent = mm+':'+ss;
  document.title = mm+':'+ss+' · Focus Timer';
  $('ring').style.strokeDashoffset = C*(1-left/total());
  $('mins').textContent = mins[mode];
  $('setlabel').textContent = mode==='focus' ? 'Focus length' : 'Break length';
  $('go').textContent = endAt ? 'Pause' : (left<total() ? 'Resume' : 'Start');
  $('hint').textContent = endAt ? 'Tap to pause' : (left<total() ? 'Paused · tap to resume' : 'Tap to start');
  $('ring-wrap').classList.toggle('run', !!endAt);
  $('dots').innerHTML = '<i></i>'.repeat(Math.min(sessions,12));
  $('count').textContent = sessions
    ? sessions+' focus session'+(sessions>1?'s':'')+' completed today'
    : 'No sessions yet today. Start your first one.';
  chips();
}

function stop(){ clearInterval(tick); tick=null; endAt=null; wakeOff(); }

function setMode(m){
  stop(); mode=m; left=total();
  document.body.classList.toggle('break', m==='break');
  $('m-focus').classList.toggle('on', m==='focus');
  $('m-break').classList.toggle('on', m==='break');
  draw();
}

function setMinutes(m){
  const [lo,hi] = LIMITS[mode];
  mins[mode] = Math.min(hi, Math.max(lo, m));
  stop(); left = total(); save(); buzz(15); draw();
}

const TONES={
 chime:[[880,0,.5,'sine'],[1175,.2,.6,'sine'],[1568,.4,.9,'sine']],
 bell:[[660,0,1.2,'triangle'],[1320,0,.8,'sine']],
 soft:[[523,0,.6,'sine'],[659,.25,.6,'sine'],[784,.5,1,'sine']],
 beep:[[880,0,.2,'square'],[880,.3,.2,'square'],[880,.6,.2,'square']],
 digital:[[1000,0,.1,'sawtooth'],[1400,.15,.1,'sawtooth'],[1000,.3,.1,'sawtooth'],[1400,.45,.1,'sawtooth']]
};
let A={sound:'chime',vib:true,notif:false,wake:false}, custom=null, actx, lock=null;
try{ Object.assign(A,JSON.parse(localStorage.getItem('alerts')||'{}')); custom=localStorage.getItem('customSound'); }catch(e){}
const saveA=()=>{ try{localStorage.setItem('alerts',JSON.stringify(A));}catch(e){} };
const note=t=>{ $('note').textContent=t; };
function unlock(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function playSound(name){
  if(name==='silent') return;
  if(name==='custom' && custom){ new Audio(custom).play().catch(()=>{}); return; }
  unlock(); if(!actx) return;
  (TONES[name]||TONES.chime).forEach(([f,d,l,t])=>{
    const o=actx.createOscillator(), g=actx.createGain(), st=actx.currentTime+d;
    o.type=t; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,st); g.gain.exponentialRampToValueAtTime(.25,st+.02); g.gain.exponentialRampToValueAtTime(.0001,st+l);
    o.start(st); o.stop(st+l+.05);
  });
}
function alertUser(){
  playSound(A.sound);
  if(A.vib) buzz([200,100,200,100,200]);
  if(A.notif && 'Notification' in window && Notification.permission==='granted'){
    const msg = mode==='focus' ? 'Focus session done. Time for a break!' : 'Break over. Ready to focus?';
    navigator.serviceWorker.ready
      .then(r=>r.showNotification('Focus Timer',{body:msg,icon:'icon-192.png',vibrate:[200,100,200]}))
      .catch(()=>{ try{ new Notification('Focus Timer',{body:msg}); }catch(e){} });
  }
}
async function wakeOn(){ try{ if(A.wake && 'wakeLock' in navigator && !lock) lock=await navigator.wakeLock.request('screen'); }catch(e){} }
function wakeOff(){ try{ lock&&lock.release(); }catch(e){} lock=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && endAt){ lock=null; wakeOn(); } });

function finish(){
  stop(); alertUser();
  if (mode==='focus'){ sessions++; save(); setMode('break'); }
  else setMode('focus');
}

function toggle(){
  buzz(20);
  if (endAt){ left=Math.max(0,Math.round((endAt-Date.now())/1000)); stop(); draw(); return; }
  unlock(); wakeOn();
  endAt = Date.now()+left*1000;
  tick = setInterval(()=>{
    left = Math.max(0,Math.round((endAt-Date.now())/1000));
    draw();
    if (left===0) finish();
  },250);
  draw();
}

$('go').onclick = toggle;
$('ring-wrap').onclick = toggle;
$('reset').onclick = ()=>{ buzz(20); setMode(mode); };
$('m-focus').onclick = ()=>setMode('focus');
$('m-break').onclick = ()=>setMode('break');
$('minus').onclick = ()=>setMinutes(mins[mode]-1);
$('plus').onclick  = ()=>setMinutes(mins[mode]+1);

// Hold + or − to change quickly
[['minus',-1],['plus',1]].forEach(([id,step])=>{
  let t, r;
  const start = ()=>{ t=setTimeout(()=>{ r=setInterval(()=>setMinutes(mins[mode]+step),90); },400); };
  const end = ()=>{ clearTimeout(t); clearInterval(r); };
  ['pointerdown'].forEach(e=>$(id).addEventListener(e,start));
  ['pointerup','pointerleave','pointercancel'].forEach(e=>$(id).addEventListener(e,end));
});

$('gear').onclick=()=>{ $('panel').hidden=!$('panel').hidden; };
$('snd').value=A.sound; $('vib').checked=A.vib; $('notif').checked=A.notif; $('wake').checked=A.wake;
$('snd').onchange=e=>{ A.sound=e.target.value; saveA(); playSound(A.sound); };
$('test').onclick=()=>playSound(A.sound);
$('vib').onchange=e=>{ A.vib=e.target.checked; saveA(); if(A.vib) buzz(100); };
$('wake').onchange=e=>{ A.wake=e.target.checked; saveA(); if(endAt){ A.wake?wakeOn():wakeOff(); } };
$('notif').onchange=async e=>{
  if(e.target.checked){
    if(!('Notification' in window)){ note('This browser does not support notifications.'); e.target.checked=false; return; }
    const p=await Notification.requestPermission();
    if(p!=='granted'){ e.target.checked=false; note('Permission blocked. Allow notifications in Chrome site settings.'); return; }
  }
  A.notif=e.target.checked; saveA();
};
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  if(f.size>1500000){ note('File too large. Choose a sound under 1.5 MB.'); return; }
  const r=new FileReader();
  r.onload=()=>{ try{
    localStorage.setItem('customSound',r.result); custom=r.result;
    A.sound='custom'; $('snd').value='custom'; saveA(); playSound('custom'); note('Your sound is saved.');
  }catch(err){ note('Could not save this file. Try a smaller one.'); } };
  r.readAsDataURL(f);
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
setMode('focus');
</script>
</body>
</html>
